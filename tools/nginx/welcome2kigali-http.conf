# Temporary HTTP-only config for welcome2kigali.net Coming Soon + certbot.
# Host-based on :80 only for welcome2kigali.net — never default_server.
# Dedicated app port 3008 (Beyond=3004, AlphaBridge=3003, Manukeza/NV=3001/3002).
server {
    listen 80;
    listen [::]:80;
    server_name welcome2kigali.net www.welcome2kigali.net;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        allow all;
    }

    root /var/www/welcome2kigali;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 127.0.0.1:3008;
    listen [::1]:3008;
    server_name _;
    root /var/www/welcome2kigali;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
}
