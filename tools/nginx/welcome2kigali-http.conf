# Temporary HTTP-only config for welcome2kigali.net Coming Soon + certbot.
server {
    listen 80;
    listen [::]:80;
    server_name welcome2kigali.net www.welcome2kigali.net;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        allow all;
    }

    root /var/www/welcome2kigali;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
