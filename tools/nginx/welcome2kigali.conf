# welcome2kigali.net — Coming Soon static site (full app deploys later).
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name welcome2kigali.net www.welcome2kigali.net;

    ssl_certificate /etc/letsencrypt/live/welcome2kigali.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/welcome2kigali.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/welcome2kigali;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name welcome2kigali.net www.welcome2kigali.net;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
