# welcome2kigali.net — live Laravel app (copied from preview).
# Host-based on :80/:443 only. Does not touch Beyond or other vhosts.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name welcome2kigali.net www.welcome2kigali.net;

    ssl_certificate /etc/letsencrypt/live/welcome2kigali.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/welcome2kigali.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/welcome2kigali-app/laravel-app;
    index index.php;
    charset utf-8;
    client_max_body_size 25M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php/php7.4-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
    }

    location ~ /\.(?!well-known).* { deny all; }
    location ~* /(?:\.env|\.env\..*|composer\.(json|lock)|artisan|server\.php|phpunit\.xml)$ { deny all; }
    location ~* ^/(app|bootstrap|config|database|deploy|db-import|resources|routes|storage|tests|vendor|read_me)/ { deny all; }

    access_log /var/log/nginx/welcome2kigali.access.log;
    error_log  /var/log/nginx/welcome2kigali.error.log;
}

server {
    listen 80;
    listen [::]:80;
    server_name welcome2kigali.net www.welcome2kigali.net;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
