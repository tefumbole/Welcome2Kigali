# Isolated Welcome 2 Kigali PREVIEW of the full Beyond clone.
# Does NOT replace Coming Soon on welcome2kigali.net
# Does NOT touch beyondtechworld.com
#
# Immediate test (no DNS):  http://187.124.2.238:8090
# After DNS A preview → 187.124.2.238:  http://preview.welcome2kigali.net
# When ready for public launch, swap Coming Soon for this app on welcome2kigali.net

server {
    listen 8090;
    listen [::]:8090;
    listen 80;
    listen [::]:80;
    server_name preview.welcome2kigali.net preview.187.124.2.238.sslip.io 187.124.2.238.sslip.io;

    root /var/www/welcome2kigali-preview/laravel-app;
    index index.php;
    charset utf-8;
    client_max_body_size 25M;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        allow all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php/php7.4-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTPS off;
    }

    location ~ /\.(?!well-known).* { deny all; }
    location ~* /(?:\.env|\.env\..*|composer\.(json|lock)|artisan|server\.php|phpunit\.xml)$ { deny all; }
    location ~* ^/(app|bootstrap|config|database|deploy|db-import|resources|routes|storage|tests|vendor|read_me)/ { deny all; }

    access_log /var/log/nginx/welcome2kigali-preview.access.log;
    error_log  /var/log/nginx/welcome2kigali-preview.error.log;
}
