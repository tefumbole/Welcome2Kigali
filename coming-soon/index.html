<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Welcome 2 Kigali Expats Club | Coming in 21 Days</title>
  <meta name="description" content="Welcome 2 Kigali Expats Club — coming in 21 days. A destination, a community, an experience. Live. Connect. Thrive." />
  <link rel="icon" type="image/png" href="w2k-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --gold: #f4b41a;
      --gold-bright: #ffd54a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: #000;
      color: var(--gold);
      font-family: Montserrat, system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .art {
      flex: 1 1 auto;
      min-height: 0;
      background: #000 url("hero-bg.png") center center / contain no-repeat;
    }
    .countdown {
      flex: 0 0 auto;
      text-align: center;
      padding: 0 1rem 1.1rem;
    }
    .eyebrow {
      font-weight: 600;
      letter-spacing: 0.55em;
      text-transform: uppercase;
      font-size: clamp(0.7rem, 1.6vw, 0.95rem);
      color: var(--gold-bright);
    }
    .days-num {
      font-weight: 800;
      font-size: clamp(5.6rem, 18vw, 11.5rem);
      letter-spacing: -0.045em;
      line-height: 0.82;
      margin: 0.12em 0 0.08em;
      text-shadow: 0 0 48px rgba(244, 180, 26, 0.32);
    }
    .days-label {
      font-weight: 700;
      letter-spacing: 0.46em;
      text-transform: uppercase;
      font-size: clamp(1.2rem, 3.6vw, 2.2rem);
      color: var(--gold-bright);
    }
    .hms {
      display: flex;
      justify-content: center;
      gap: clamp(1.1rem, 4vw, 2.6rem);
      margin-top: 0.7rem;
    }
    .hms strong {
      display: block;
      font-size: clamp(1.2rem, 3.2vw, 2rem);
      font-weight: 700;
    }
    .hms span {
      display: block;
      margin-top: 0.15rem;
      font-size: 0.58rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(244, 180, 26, 0.68);
    }
    @media (max-height: 700px) {
      .days-num { font-size: clamp(4rem, 14vw, 8rem); }
    }
  </style>
</head>
<body>
  <div class="art" role="img" aria-label="Welcome 2 Expat Club"></div>
  <section class="countdown" aria-live="polite">
    <p class="eyebrow">Coming in</p>
    <div class="days-num" id="days">21</div>
    <div class="days-label">Days</div>
    <div class="hms">
      <div><strong id="hours">00</strong><span>Hours</span></div>
      <div><strong id="mins">00</strong><span>Minutes</span></div>
      <div><strong id="secs">00</strong><span>Seconds</span></div>
    </div>
  </section>
  <script>
    // Midnight 16 Sep 2026 CAT — reads as 21 days throughout 25 Aug.
    var LAUNCH = new Date("2026-09-16T00:00:00+02:00").getTime();
    function pad(n) { return String(n).padStart(2, "0"); }
    function tick() {
      var left = Math.max(0, LAUNCH - Date.now());
      var d = Math.floor(left / 86400000);
      var h = Math.floor((left % 86400000) / 3600000);
      var m = Math.floor((left % 3600000) / 60000);
      var s = Math.floor((left % 60000) / 1000);
      document.getElementById("days").textContent = String(d);
      document.getElementById("hours").textContent = pad(h);
      document.getElementById("mins").textContent = pad(m);
      document.getElementById("secs").textContent = pad(s);
    }
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
